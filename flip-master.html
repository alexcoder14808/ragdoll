<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flip Master — Neon Gym</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;height:100%;width:100%;}
  canvas{display:block;touch-action:none;position:fixed;inset:0;}
  #ui{position:fixed;inset:0;z-index:20;pointer-events:none;}
  .pe-auto{pointer-events:auto;}
  .stat-num{font-weight:800;font-size:clamp(20px,4vw,34px);line-height:1;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,0.6), 0 0 18px rgba(56,189,248,0.35);}
  .stat-label{font-weight:700;font-size:clamp(9px,1.4vw,12px);letter-spacing:.14em;color:rgba(255,255,255,0.55);}
  .hud-chip{background:linear-gradient(180deg, rgba(10,12,22,0.78), rgba(10,12,22,0.5));backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.09);}
  .btn{transition:transform .12s ease, filter .12s ease;}
  .btn:hover{filter:brightness(1.15);}
  .btn:active{transform:scale(0.94);}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 0px rgba(56,189,248,0.0);}50%{box-shadow:0 0 22px rgba(56,189,248,0.55);}}
  .glow-pulse{animation:pulseGlow 1.3s ease-in-out infinite;}
  @keyframes floatUp{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-24px);opacity:0;}}
  .float-toast{animation:floatUp 1.3s ease-out forwards;}
  @keyframes popIn{0%{transform:scale(0.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .pop-in{animation:popIn .35s cubic-bezier(.2,1.4,.4,1) forwards;}
  #charge-wrap{transition:opacity .15s ease, transform .15s ease;}
  #charge-fill{transition:width 0.04s linear;}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
  <!-- TOP-LEFT: FLIPS / LEVEL (plain, no panel — matches the arcade HUD look) -->
  <div class="absolute top-4 left-4 sm:top-6 sm:left-7 select-none">
    <div class="stat-label">FLIPS</div>
    <div class="stat-num" id="flips-num">0</div>
    <div class="stat-label mt-2" id="level-num">LEVEL 1</div>
  </div>

  <!-- TOP-RIGHT: score / attempts + reset -->
  <div class="absolute top-4 right-4 sm:top-6 sm:right-7 flex flex-col items-end gap-2">
    <div class="hud-chip rounded-xl px-3 py-1.5 sm:px-4 sm:py-2 text-white text-right">
      <div class="stat-label">SCORE</div>
      <div class="text-base sm:text-xl font-bold leading-tight"><span id="score">0</span></div>
    </div>
    <button id="reset-btn" class="pe-auto btn hud-chip hover:bg-white/10 text-white text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1.5">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 4v6h6"/></svg>
      Reset
    </button>
  </div>

  <!-- LEVEL NAME BANNER -->
  <div class="absolute top-4 left-1/2 -translate-x-1/2 sm:top-6 text-center select-none">
    <div class="text-white/70 text-[11px] sm:text-sm font-semibold tracking-wide" id="level-name">Warm-Up Mat</div>
  </div>

  <!-- TOAST -->
  <div id="toast-wrap" class="absolute top-24 sm:top-28 left-1/2 -translate-x-1/2 flex flex-col items-center gap-1 pointer-events-none"></div>

  <!-- BOTTOM: tip + charge bar + next button -->
  <div class="absolute bottom-0 left-0 right-0 flex flex-col items-center pb-4 sm:pb-6 gap-3">
    <div class="hud-chip rounded-full px-4 py-1.5 text-white/85 text-xs sm:text-sm font-medium" id="tip-chip">Hold SPACE to charge</div>

    <div id="charge-wrap" class="opacity-0 w-64 sm:w-96">
      <div class="hud-chip rounded-xl px-3 py-2.5 sm:px-4 sm:py-3">
        <div class="text-[10px] sm:text-xs font-bold tracking-widest text-white/80 mb-1.5 text-center" id="charge-label">HOLD SPACE TO CHARGE</div>
        <div class="w-full h-3 sm:h-3.5 rounded-full bg-black/40 overflow-hidden border border-white/10">
          <div id="charge-fill" class="h-full rounded-full bg-gradient-to-r from-indigo-500 via-sky-400 to-fuchsia-400" style="width:0%"></div>
        </div>
      </div>
    </div>

    <button id="next-btn" class="hidden pe-auto btn glow-pulse bg-gradient-to-br from-sky-400 to-fuchsia-500 text-black text-sm font-bold px-6 py-2.5 rounded-xl">
      Next Level →
    </button>
  </div>

  <!-- WIN SCREEN -->
  <div id="complete-screen" class="hidden absolute inset-0 bg-black/85 flex items-center justify-center pointer-events-auto">
    <div class="pop-in text-center px-6">
      <div class="text-sky-300 text-sm font-semibold tracking-wide mb-2">FLIP MASTER</div>
      <div class="text-3xl sm:text-5xl font-black text-white mb-3">Gym Cleared</div>
      <div class="text-white/60 mb-6 text-sm sm:text-base">All 5 arenas stuck. Final score: <span id="final-score" class="text-sky-300 font-bold">0</span></div>
      <button id="play-again-btn" class="btn bg-gradient-to-br from-sky-400 to-fuchsia-500 text-black font-bold px-6 py-3 rounded-xl">Play Again</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

// ---------------------------------------------------------------------
// CANVAS SETUP
// ---------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  buildLevel(levelIndex, true);
}
window.addEventListener('resize', resize);

// ---------------------------------------------------------------------
// UNIFIED LAUNCH PHYSICS (used identically by preview, sim, and launch)
// ---------------------------------------------------------------------
const VX0 = 5.8, VX1 = 7.6;      // horizontal speed range across charge power 0..1
const VYM0 = 9.5, VYM1 = 8.0;    // vertical speed magnitude range
function vxOf(p){ return VX0 + VX1*p; }
function vyMagOf(p){ return VYM0 + VYM1*p; }

// Simulate where (relative x, from launch point) the character's hip returns
// to the launch height, for a given charge power & gravity. This is the same
// integration the real game loop uses, so predicted and actual landings match.
function simulateLandingX(p, gravity){
  let x=0, y=0;
  let vx = vxOf(p), vy = -vyMagOf(p);
  let leftGround = false;
  for(let i=0;i<4000;i++){
    vy += gravity; x += vx; y += vy;
    if(y<0) leftGround = true;
    if(leftGround && y>=0) return x;
  }
  return x;
}
function apexInfo(p, gravity){
  const vx = vxOf(p), vyMag = vyMagOf(p);
  const tApex = vyMag/gravity;
  return { x: vx*tApex, height: (vyMag*vyMag)/(2*gravity) };
}

// ---------------------------------------------------------------------
// GLOBAL STATE
// ---------------------------------------------------------------------
let levelIndex = 0;
let level = null;
let score = 0;
let attempts = 0;
let cameraX = 0;
let gameState = 'idle'; // idle, charging, airborne, success, crashed, level-complete
let bgTime = 0;

const GROUND_OFFSET = 74;
const MAX_HOLD_MS = 900;

let char = { x:0, y:0, vx:0, vy:0, theta:0, omega:0, tuck:0, targetTuck:0, dir:1 };
let flipsThisAttempt = 0;
let lastFlipCount = 0;

let chargeStart = 0;
let chargePower = 0;

let ragdoll = null;
let successTimer = 0;
const SUCCESS_HOLD = 1.5;

let particles = [];
let dustMotes = [];

// ---------------------------------------------------------------------
// CHARACTER POSE TEMPLATE (unchanged proven ragdoll rig)
// ---------------------------------------------------------------------
const POSE_EXT = {
  head:[0,-78], neck:[0,-52], hip:[0,0],
  shL:[-16,-46], elL:[-27,-24], haL:[-31,-2],
  shR:[16,-46], elR:[27,-24], haR:[31,-2],
  kneeL:[-9,37], footL:[-11,74],
  kneeR:[9,37], footR:[11,74]
};
const POSE_TUCK = {
  head:[0,-32], neck:[0,-15], hip:[0,0],
  shL:[-15,-10], elL:[-25,3], haL:[-19,20],
  shR:[15,-10], elR:[25,3], haR:[19,20],
  kneeL:[-15,-9], footL:[-11,10],
  kneeR:[15,-9], footR:[11,10]
};
const EDGES = [
  ['neck','hip'],['neck','head'],
  ['neck','shL'],['shL','elL'],['elL','haL'],
  ['neck','shR'],['shR','elR'],['elR','haR'],
  ['hip','kneeL'],['kneeL','footL'],
  ['hip','kneeR'],['kneeR','footR']
];
const REST_LEN = {};
(function computeRestLengths(){
  for(const [a,b] of EDGES){
    const pa=POSE_EXT[a], pb=POSE_EXT[b];
    REST_LEN[a+'-'+b] = Math.hypot(pa[0]-pb[0], pa[1]-pb[1]);
  }
})();
function getLocalPose(t){
  const p={};
  for(const k in POSE_EXT){
    p[k]=[ POSE_EXT[k][0]+(POSE_TUCK[k][0]-POSE_EXT[k][0])*t,
           POSE_EXT[k][1]+(POSE_TUCK[k][1]-POSE_EXT[k][1])*t ];
  }
  return p;
}
function worldPose(c){
  const local=getLocalPose(c.tuck);
  const cos=Math.cos(c.theta), sin=Math.sin(c.theta), dir=c.dir;
  const out={};
  for(const k in local){
    const lx=local[k][0]*dir, ly=local[k][1];
    out[k]=[ c.x+lx*cos-ly*sin, c.y+lx*sin+ly*cos ];
  }
  return out;
}

// ---------------------------------------------------------------------
// LEVEL DEFINITIONS — geometry is derived from real physics so every
// landing mat is guaranteed reachable within its stated charge window.
// ---------------------------------------------------------------------
const LEVEL_DEFS = [
  { name:'Warm-Up Mat',      theme:'green',   gravity:0.52, pw:[0.22,0.78], pit:false, beam:false, tip:'Flat floor, no obstacles. Hold SPACE, release, and stick the landing.' },
  { name:'The Pit',          theme:'magenta', gravity:0.52, pw:[0.28,0.70], pit:true,  beam:false, tip:'Clear the gap — undercharge and you fall straight in.' },
  { name:'High Beam',        theme:'amber',   gravity:0.52, pw:[0.28,0.68], pit:false, beam:true,  tip:'A raised beam blocks the arc — throw with enough height to clear it.' },
  { name:'The Gauntlet',     theme:'red',     gravity:0.55, pw:[0.32,0.62], pit:true,  beam:true,  tip:'Gap and beam together, tighter window. Precision run.' },
  { name:'Zero-G Arena',     theme:'cosmic',  gravity:0.26, pw:[0.30,0.64], pit:false, beam:true,  tip:'Low gravity — longer, floatier flight. Time your tuck for extra flips.' },
];

function buildLevel(idx, preserveState){
  const groundY = H*0.76;
  const def = LEVEL_DEFS[idx];
  const startX = W*0.2;
  const g = def.gravity;

  const zoneX1 = startX + simulateLandingX(def.pw[0], g);
  const zoneX2 = startX + simulateLandingX(def.pw[1], g);
  const matX1 = startX + simulateLandingX(Math.max(0, def.pw[0]-0.12), g) - 26;
  const matX2 = startX + simulateLandingX(Math.min(1, def.pw[1]+0.16), g) + 46;
  const pedestalEdge = startX + 62;

  const platforms = [];
  if(def.pit){
    platforms.push({ x1:-2000, x2:pedestalEdge, y:groundY, ground:true });
    platforms.push({ x1:matX1, x2:matX2, y:groundY, finite:true, thickness:50 });
  } else {
    platforms.push({ x1:-2000, x2:matX2+400, y:groundY, ground:true });
  }

  const obstacles = [];
  if(def.beam){
    const pMid = (def.pw[0]+def.pw[1])/2;
    const apex = apexInfo(pMid, g);
    const beamW = 150, beamH = 20;
    const beamX = startX + apex.x - beamW/2;
    const beamY = groundY - apex.height*0.5 - beamH/2;
    obstacles.push({ type:'beam', x:beamX, y:beamY, w:beamW, h:beamH });
  }

  level = {
    name: def.name, tip: def.tip, theme: def.theme, gravity: g, powerWindow: def.pw,
    groundY, startX, platforms, obstacles,
    landingZone: { x1:zoneX1, x2:zoneX2, y:groundY },
    worldWidth: matX2 + W*0.9,
    hasPit: def.pit
  };

  if(dustMotes.length===0 || preserveState) dustMotes = makeDustMotes();

  if(!preserveState){
    resetCharToStart();
    gameState='idle';
    ragdoll=null; particles=[]; successTimer=0; flipsThisAttempt=0;
    hideNext();
  } else if(gameState==='idle'){
    resetCharToStart();
  }
  updateHUDLevel();
}

function resetCharToStart(){
  char.x = level.startX;
  char.y = level.groundY - GROUND_OFFSET;
  char.vx=0; char.vy=0; char.theta=0; char.omega=0; char.tuck=0; char.targetTuck=0; char.dir=1;
  cameraX = 0;
  flipsThisAttempt = 0;
  lastFlipCount = 0;
  updateHUDFlips();
}

function groundYAt(x){
  for(const p of level.platforms){ if(x>=p.x1 && x<=p.x2) return p.y; }
  return Infinity;
}

function makeDustMotes(){
  const arr=[];
  for(let i=0;i<70;i++){
    arr.push({ x:Math.random()*W*4, y:Math.random()*H*0.7, r:Math.random()*1.4+0.4, sp:0.1+Math.random()*0.2, layer:0.1+Math.random()*0.2 });
  }
  return arr;
}

// ---------------------------------------------------------------------
// INPUT
// ---------------------------------------------------------------------
function onDown(e){
  if(e.preventDefault) e.preventDefault();
  if(gameState==='idle'){
    gameState='charging';
    chargeStart = performance.now();
    document.getElementById('charge-wrap').style.opacity='1';
    setTip('Release to launch');
  } else if(gameState==='airborne'){
    char.targetTuck = 1;
  }
}
function onUp(e){
  if(gameState==='charging'){
    launch();
  } else if(gameState==='airborne'){
    char.targetTuck = 0;
  }
}
canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mouseup', onUp);
canvas.addEventListener('mouseleave', ()=>{ if(gameState==='charging') onUp(); });
canvas.addEventListener('touchstart', onDown, {passive:false});
canvas.addEventListener('touchend', onUp, {passive:false});
canvas.addEventListener('touchcancel', onUp, {passive:false});

let spaceHeld=false;
window.addEventListener('keydown', (e)=>{
  if(e.code==='Space' || e.key===' '){
    e.preventDefault();
    if(e.repeat || spaceHeld) return;
    spaceHeld=true;
    onDown(e);
  }
});
window.addEventListener('keyup', (e)=>{
  if(e.code==='Space' || e.key===' '){
    e.preventDefault();
    spaceHeld=false;
    onUp(e);
  }
});

document.getElementById('reset-btn').addEventListener('click', resetRun);
document.getElementById('next-btn').addEventListener('click', goNextLevel);
document.getElementById('play-again-btn').addEventListener('click', ()=>{
  levelIndex=0; score=0; attempts=0;
  document.getElementById('complete-screen').classList.add('hidden');
  updateHUDScore();
  buildLevel(levelIndex,false);
});

function resetRun(){
  gameState='idle';
  ragdoll=null; particles=[]; successTimer=0;
  resetCharToStart();
  hideNext();
  document.getElementById('charge-wrap').style.opacity='0';
  setTip('Hold SPACE to charge');
}
function goNextLevel(){
  levelIndex++;
  if(levelIndex>=LEVEL_DEFS.length){
    document.getElementById('final-score').textContent = score;
    document.getElementById('complete-screen').classList.remove('hidden');
    return;
  }
  buildLevel(levelIndex,false);
}

// ---------------------------------------------------------------------
// LAUNCH
// ---------------------------------------------------------------------
function launch(){
  attempts++;
  const power = chargePower;
  char.vx = vxOf(power);
  char.vy = -vyMagOf(power);
  char.omega = 0.08;
  char.tuck = 0.35; char.targetTuck = 0;
  flipsThisAttempt = 0; lastFlipCount = 0;
  updateHUDFlips();
  gameState='airborne';
  chargePower = 0;
  document.getElementById('charge-wrap').style.opacity='0';
  setTip('Hold SPACE to tuck · release to extend');
}

// ---------------------------------------------------------------------
// PARTICLES
// ---------------------------------------------------------------------
function spawnConfetti(x,y){
  const colors=['#38bdf8','#f472b6','#34d399','#facc15','#a78bfa','#fb7185'];
  for(let i=0;i<70;i++){
    particles.push({ x,y, vx:(Math.random()-0.5)*9, vy:-Math.random()*9-2, g:0.28, life:1,
      decay:0.010+Math.random()*0.01, size:3+Math.random()*3, color:colors[(Math.random()*colors.length)|0],
      rot:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.3, type:'confetti' });
  }
}
function spawnDust(x,y,n){
  for(let i=0;i<(n||30);i++){
    particles.push({ x,y, vx:(Math.random()-0.5)*6, vy:-Math.random()*4, g:0.22, life:1,
      decay:0.02+Math.random()*0.02, size:2+Math.random()*4, color:Math.random()<0.5?'#9ca3af':'#d1d5db', type:'dust' });
  }
}
function spawnSparks(x,y){
  for(let i=0;i<24;i++){
    const a=Math.random()*Math.PI*2, s=Math.random()*7+2;
    particles.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, g:0.35, life:1,
      decay:0.03+Math.random()*0.02, size:1.5+Math.random()*1.5, color:'#fde68a', type:'spark' });
  }
}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
    if(p.rot!==undefined) p.rot+=p.vr;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  ctx.save(); ctx.translate(-cameraX,0);
  for(const p of particles){
    ctx.globalAlpha=Math.max(p.life,0);
    if(p.type==='confetti'){
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*1.6);
      ctx.restore();
    } else {
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha=1; ctx.restore();
}

// ---------------------------------------------------------------------
// TOAST / HUD TEXT
// ---------------------------------------------------------------------
function toast(msg, color){
  const wrap=document.getElementById('toast-wrap');
  const el=document.createElement('div');
  el.className='float-toast hud-chip rounded-full px-4 py-1.5 text-xs sm:text-sm font-bold';
  el.style.color=color||'#fff';
  el.textContent=msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(),1300);
}
function setTip(msg){ document.getElementById('tip-chip').textContent = msg; }
function updateHUDLevel(){
  document.getElementById('level-num').textContent = 'LEVEL '+(levelIndex+1);
  document.getElementById('level-name').textContent = level.name;
  setTip(level.tip);
}
function updateHUDScore(){ document.getElementById('score').textContent = score; }
function updateHUDFlips(){ document.getElementById('flips-num').textContent = flipsThisAttempt; }

// ---------------------------------------------------------------------
// RAGDOLL (crash physics) — unchanged proven system
// ---------------------------------------------------------------------
function createRagdoll(c){
  const p=worldPose(c); const pts={};
  for(const k in p) pts[k]={ x:p[k][0], y:p[k][1], px:p[k][0]-c.vx*0.9, py:p[k][1]-c.vy*0.9 };
  return pts;
}
function updateRagdoll(pts){
  for(const k in pts){
    const pt=pts[k];
    const vx=(pt.x-pt.px)*0.985, vy=(pt.y-pt.py)*0.985;
    pt.px=pt.x; pt.py=pt.y;
    pt.x+=vx; pt.y+=vy+level.gravity*0.9;
  }
  for(let iter=0; iter<6; iter++){
    for(const [a,b] of EDGES){
      const pa=pts[a], pb=pts[b];
      const dx=pb.x-pa.x, dy=pb.y-pa.y;
      const dist=Math.hypot(dx,dy)||0.001;
      const rest=REST_LEN[a+'-'+b];
      const diff=(dist-rest)/dist*0.5;
      const ox=dx*diff, oy=dy*diff;
      pa.x+=ox; pa.y+=oy; pb.x-=ox; pb.y-=oy;
    }
    for(const k in pts){
      const pt=pts[k];
      const gy=groundYAt(pt.x);
      const floor=isFinite(gy)?gy:level.groundY+400;
      if(pt.y>floor){ pt.y=floor; pt.px+=(pt.x-pt.px)*0.35; pt.py=pt.y+(pt.y-pt.py)*0.15; }
    }
  }
}
function drawRagdoll(pts){
  ctx.save(); ctx.translate(-cameraX,0);
  ctx.strokeStyle='#f87171'; ctx.lineWidth=8; ctx.lineCap='round';
  function line(a,b){ ctx.beginPath(); ctx.moveTo(pts[a].x,pts[a].y); ctx.lineTo(pts[b].x,pts[b].y); ctx.stroke(); }
  for(const [a,b] of EDGES){ if(!(a==='neck'&&b==='head')) line(a,b); }
  ctx.fillStyle='#fca5a5';
  ctx.beginPath(); ctx.arc(pts.head.x,pts.head.y,16,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// ---------------------------------------------------------------------
// CRASH / SUCCESS
// ---------------------------------------------------------------------
function triggerCrash(reason){
  if(gameState==='crashed') return;
  gameState='crashed';
  ragdoll=createRagdoll(char);
  spawnDust(char.x, char.y+GROUND_OFFSET*0.5, 40);
  spawnSparks(char.x, char.y);
  toast(reason||'Crashed!', '#f87171');
  setTip('Crashed — '+(reason||'try again')+'. Tap Reset.');
  document.getElementById('charge-wrap').style.opacity='0';
}
function triggerSuccess(){
  gameState='success';
  char.vx=0; char.vy=0; char.omega=0;
  char.theta = Math.round(char.theta/(Math.PI*2))*Math.PI*2;
  char.tuck=0; char.targetTuck=0;
  successTimer = SUCCESS_HOLD;
  spawnConfetti(char.x, char.y-40);
  toast('Perfect Landing! '+flipsThisAttempt+' flip'+(flipsThisAttempt===1?'':'s'), '#34d399');
}
function finalizeWin(){
  gameState='level-complete';
  score += 100 + flipsThisAttempt*15 + Math.max(0, 40-attempts*4);
  updateHUDScore();
  showNext();
  setTip('Landed clean! Press Next Level to continue.');
}
function showNext(){ document.getElementById('next-btn').classList.remove('hidden'); }
function hideNext(){ document.getElementById('next-btn').classList.add('hidden'); }

// ---------------------------------------------------------------------
// COLLISION
// ---------------------------------------------------------------------
function poseBoundsHit(pose, rect){
  for(const k in pose){
    const x=pose[k][0], y=pose[k][1];
    if(x>rect.x-6 && x<rect.x+rect.w+6 && y>rect.y-6 && y<rect.y+rect.h+6) return true;
  }
  return false;
}
function checkObstacles(pose){
  for(const o of level.obstacles){
    if(poseBoundsHit(pose, o)) return true;
  }
  return false;
}

// ---------------------------------------------------------------------
// MAIN UPDATE
// ---------------------------------------------------------------------
function update(dt){
  bgTime += dt*16.6;

  if(gameState==='charging'){
    const elapsed = performance.now()-chargeStart;
    chargePower = Math.min(elapsed/MAX_HOLD_MS, 1);
    char.targetTuck = 0.42*chargePower;
    char.tuck += (char.targetTuck-char.tuck)*0.22;
    document.getElementById('charge-fill').style.width = (chargePower*100)+'%';
  }

  if(gameState==='airborne'){
    char.vy += level.gravity;
    char.x += char.vx;
    char.y += char.vy;

    char.tuck += (char.targetTuck-char.tuck)*0.24;
    const omegaExtended=0.075, omegaTucked=0.24;
    const targetOmega = omegaExtended + (omegaTucked-omegaExtended)*char.tuck;
    char.omega += (targetOmega-char.omega)*0.22;
    char.theta += char.omega;

    const totalFlips = Math.floor(Math.abs(char.theta)/(Math.PI*2));
    if(totalFlips!==lastFlipCount){ lastFlipCount=totalFlips; flipsThisAttempt=totalFlips; updateHUDFlips(); }

    const targetCam = char.x - W*0.32;
    cameraX += (targetCam-cameraX)*0.08;
    cameraX = Math.max(0, Math.min(cameraX, Math.max(0, level.worldWidth-W)));

    const pose = worldPose(char);

    if(checkObstacles(pose)){
      triggerCrash('Hit the beam');
    } else {
      let lowestY=-Infinity;
      for(const k in pose){ if(pose[k][1]>lowestY) lowestY=pose[k][1]; }
      const gY = groundYAt(char.x);
      const contact = isFinite(gY) ? gY : level.groundY+500;
      if(lowestY>=contact){
        attemptLanding(gY);
      } else if(char.y > level.groundY+700){
        triggerCrash('Fell in the pit');
      }
    }
  }

  if(gameState==='success'){
    successTimer -= dt/60;
    if(successTimer<=0) finalizeWin();
  }

  if(gameState==='crashed' && ragdoll){
    for(let s=0;s<2;s++) updateRagdoll(ragdoll);
  }

  updateParticles();
}

function attemptLanding(gY){
  const normTheta = ((char.theta % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  const diffToUpright = Math.min(normTheta, Math.PI*2-normTheta);
  const uprightOK = diffToUpright < 0.42;
  const velOK = Math.abs(char.vy) < 15 && Math.abs(char.omega) < 0.14;
  const inZone = isFinite(gY) && char.x>=level.landingZone.x1 && char.x<=level.landingZone.x2;

  char.y = gY - GROUND_OFFSET;

  if(uprightOK && velOK && inZone){
    triggerSuccess();
  } else if(!isFinite(gY)){
    triggerCrash('Missed the mat');
  } else if(!inZone){
    triggerCrash('Just outside the zone');
  } else {
    triggerCrash('Bad landing angle');
  }
}

// ---------------------------------------------------------------------
// THEME COLORS
// ---------------------------------------------------------------------
const THEMES = {
  green:   { wallL:'#22c55e', wallR:'#22d3ee', floor1:'#0f172a', floor2:'#111827', accent:'#38bdf8', sky:['#0a0e1a','#141b30'] },
  magenta: { wallL:'#f472b6', wallR:'#a855f7', floor1:'#0d0a17', floor2:'#150f22', accent:'#f472b6', sky:['#0a0714','#160a26'] },
  amber:   { wallL:'#f59e0b', wallR:'#fb923c', floor1:'#140f0a', floor2:'#1c140c', accent:'#fbbf24', sky:['#0f0a06','#221507'] },
  red:     { wallL:'#ef4444', wallR:'#a855f7', floor1:'#150808', floor2:'#1e0b0b', accent:'#f87171', sky:['#0e0505','#1f0808'] },
  cosmic:  { wallL:'#a855f7', wallR:'#22d3ee', floor1:'#0a0616', floor2:'#0f0a20', accent:'#5eead4', sky:['#050318','#140a2e'] }
};

// ---------------------------------------------------------------------
// BACKGROUND — stylized neon gym corridor (2D side-view w/ perspective framing)
// ---------------------------------------------------------------------
function drawBackground(){
  const th = THEMES[level.theme];

  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // faint nebula / haze for cosmic theme
  if(level.theme==='cosmic'){
    for(const s of dustMotes){
      const sx = (s.x - cameraX*0.06) % (W*4);
      const wx = ((sx%(W*4))+W*4)%(W*4);
      const tw = 0.5+0.5*Math.sin(bgTime*0.003+s.x);
      ctx.fillStyle=`rgba(255,255,255,${tw*0.7})`;
      ctx.beginPath(); ctx.arc(wx, s.y*0.7, s.r, 0, Math.PI*2); ctx.fill();
    }
  }

  // ceiling lights strip
  ctx.save();
  const lightY = H*0.06;
  for(let i=0;i<10;i++){
    const lx = (i*160 - cameraX*0.15) % (W+320) - 160;
    ctx.fillStyle='rgba(226,232,240,0.10)';
    ctx.fillRect(lx, lightY, 90, 10);
    ctx.fillStyle='rgba(226,232,240,0.28)';
    ctx.fillRect(lx+10, lightY+2, 70, 4);
  }
  ctx.restore();

  // converging neon side walls (fixed corridor framing, slight parallax)
  const wallDepth = W*0.16;
  const horizonY = H*0.30;
  ctx.save();
  const offL = -cameraX*0.05;
  // left wall
  const gl = ctx.createLinearGradient(0,0,wallDepth,0);
  gl.addColorStop(0, hexA(th.wallL,0.16)); gl.addColorStop(1, hexA(th.wallL,0.0));
  ctx.fillStyle=gl;
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(wallDepth,horizonY); ctx.lineTo(wallDepth,H*0.85); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=hexA(th.wallL,0.75+0.15*Math.sin(bgTime*0.004));
  ctx.lineWidth=3; ctx.shadowColor=th.wallL; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.moveTo(wallDepth,horizonY); ctx.lineTo(wallDepth,H*0.85); ctx.stroke();
  ctx.shadowBlur=0;
  // right wall
  const gr = ctx.createLinearGradient(W,0,W-wallDepth,0);
  gr.addColorStop(0, hexA(th.wallR,0.16)); gr.addColorStop(1, hexA(th.wallR,0.0));
  ctx.fillStyle=gr;
  ctx.beginPath();
  ctx.moveTo(W,0); ctx.lineTo(W-wallDepth,horizonY); ctx.lineTo(W-wallDepth,H*0.85); ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=hexA(th.wallR,0.75+0.15*Math.sin(bgTime*0.004+1));
  ctx.shadowColor=th.wallR; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.moveTo(W-wallDepth,horizonY); ctx.lineTo(W-wallDepth,H*0.85); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.restore();

  // faint gymnastics equipment silhouettes (world-scrolling, low parallax)
  ctx.save(); ctx.translate(-cameraX*0.35,0);
  ctx.fillStyle='rgba(255,255,255,0.045)';
  for(let i=0;i<10;i++){
    const ex = i*520+260;
    drawEquipmentSilhouette(ex, level.groundY);
  }
  ctx.restore();

  // floor
  ctx.save(); ctx.translate(-cameraX,0);
  for(const p of level.platforms) drawPlatformSlab(p, th);
  // beam obstacles
  for(const o of level.obstacles){
    if(o.type==='beam') drawBeam(o, th);
  }
  ctx.restore();

  // vignette
  const vg = ctx.createRadialGradient(W/2,H*0.55,H*0.2,W/2,H*0.55,H*0.95);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.45)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}

function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  const r=(n>>16)&255, g2=(n>>8)&255, b=n&255;
  return `rgba(${r},${g2},${b},${a})`;
}

function drawEquipmentSilhouette(x,groundY){
  ctx.save(); ctx.translate(x,groundY);
  // pommel-horse-like block + bar
  ctx.fillRect(-40,-70,80,70);
  ctx.fillRect(-4,-140,8,70);
  ctx.beginPath(); ctx.ellipse(0,-140,46,6,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawPlatformSlab(p, th){
  const thickness = p.thickness || 46;
  const x1=p.x1, x2=p.x2, y=p.y, w=x2-x1;
  ctx.fillStyle = th.accent;
  ctx.fillRect(x1,y,w,6);
  const grad=ctx.createLinearGradient(0,y+6,0,y+6+thickness);
  grad.addColorStop(0, th.floor2); grad.addColorStop(1, th.floor1);
  ctx.fillStyle=grad;
  if(p.ground){
    ctx.fillRect(x1,y+6,w,Math.max(thickness,H-y+400));
  } else {
    ctx.fillRect(x1,y+6,w,thickness);
    const sw=ctx.createLinearGradient(0,y+6+thickness,0,y+6+thickness+30);
    sw.addColorStop(0,'rgba(0,0,0,0.4)'); sw.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=sw; ctx.fillRect(x1,y+6+thickness,w,30);
  }
  // subtle floor tick marks for a sense of speed/scrolling
  ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=2;
  for(let x=x1; x<x2; x+=46){
    ctx.beginPath(); ctx.moveTo(x,y+6); ctx.lineTo(x+18,y+6+thickness*0.6); ctx.stroke();
  }
  ctx.strokeStyle = th.accent; ctx.lineWidth=2;
  if(x1>-1900){ ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x1, p.ground?y+H:y+6+thickness); ctx.stroke(); }
  if(x2<level.worldWidth+1900){ ctx.beginPath(); ctx.moveTo(x2,y); ctx.lineTo(x2, p.ground?y+H:y+6+thickness); ctx.stroke(); }
}

function drawBeam(o, th){
  ctx.save();
  ctx.shadowColor = th.wallR; ctx.shadowBlur=16;
  const grad = ctx.createLinearGradient(o.x,o.y,o.x,o.y+o.h);
  grad.addColorStop(0, th.wallR); grad.addColorStop(1, th.wallL);
  ctx.fillStyle=grad;
  ctx.fillRect(o.x,o.y,o.w,o.h);
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(0,0,0,0.35)';
  for(let x=o.x; x<o.x+o.w; x+=16){
    ctx.fillRect(x,o.y,7,o.h);
  }
  ctx.restore();
}

// ---------------------------------------------------------------------
// LAUNCH PEDESTAL, MAT & TRAJECTORY
// ---------------------------------------------------------------------
function drawPedestal(){
  const th = THEMES[level.theme];
  ctx.save(); ctx.translate(-cameraX,0);
  const x = level.startX, y = level.groundY;
  ctx.fillStyle = th.floor2;
  ctx.fillRect(x-34,y-18,68,18);
  ctx.strokeStyle = th.accent; ctx.lineWidth=2;
  ctx.strokeRect(x-34,y-18,68,18);
  // spring coils
  ctx.strokeStyle=hexA(th.accent,0.7); ctx.lineWidth=2;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.ellipse(x-20+i*20, y-9, 8, 5, 0, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawLandingMat(){
  const z = level.landingZone;
  const th = THEMES[level.theme];
  const win = gameState==='success' || gameState==='level-complete';
  const mainColor = win ? '#34d399' : th.accent;
  const pulse = 0.5+0.5*Math.sin(bgTime*0.006);
  ctx.save(); ctx.translate(-cameraX,0);
  const cx=(z.x1+z.x2)/2, zw=z.x2-z.x1;

  // beacon glow
  const beam=ctx.createLinearGradient(0,z.y-360,0,z.y);
  beam.addColorStop(0,'rgba(0,0,0,0)');
  beam.addColorStop(1, hexA(mainColor, 0.14+0.08*pulse));
  ctx.fillStyle=beam;
  ctx.fillRect(cx-zw*0.4, z.y-360, zw*0.8, 360);

  // mat body (blue, matches reference)
  const matH=16;
  ctx.fillStyle='#1d4ed8';
  ctx.fillRect(z.x1, z.y-matH, zw, matH);
  ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=2.5;
  ctx.strokeRect(z.x1, z.y-matH, zw, matH);

  // inset bullseye "sweet spot"
  const inset = Math.min(zw*0.22, 34);
  ctx.strokeStyle = mainColor; ctx.lineWidth=2.5;
  ctx.setLineDash([6,5]);
  ctx.strokeRect(z.x1+inset*0.4, z.y-matH+3, zw-inset*0.8, matH-6);
  ctx.setLineDash([]);

  ctx.save();
  ctx.globalAlpha=0.85+0.15*pulse;
  ctx.strokeStyle=mainColor; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(cx, z.y-matH/2, 14+2*pulse, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-18,z.y-matH/2); ctx.lineTo(cx+18,z.y-matH/2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,z.y-matH/2-18); ctx.lineTo(cx,z.y-matH/2+18); ctx.stroke();
  ctx.restore();

  // label
  ctx.font='bold 12px sans-serif';
  const label='LANDING ZONE';
  const tw=ctx.measureText(label).width, pillW=tw+24, pillH=22;
  ctx.fillStyle='rgba(8,10,18,0.75)';
  roundRect(cx-pillW/2, z.y-matH-46, pillW, pillH, 11); ctx.fill();
  ctx.strokeStyle=mainColor; ctx.lineWidth=1.4;
  roundRect(cx-pillW/2, z.y-matH-46, pillW, pillH, 11); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label, cx, z.y-matH-46+pillH/2+1);
  ctx.textBaseline='alphabetic';

  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawOffscreenZoneArrow(){
  if(gameState==='crashed'||gameState==='success'||gameState==='level-complete') return;
  const z=level.landingZone, cx=(z.x1+z.x2)/2, screenX=cx-cameraX;
  if(screenX>=-20 && screenX<=W+20) return;
  const y=H*0.42, dir=screenX<0?-1:1, x=dir<0?26:W-26;
  ctx.save();
  ctx.fillStyle='rgba(56,189,248,0.9)';
  ctx.beginPath();
  if(dir<0){ ctx.moveTo(x-12,y); ctx.lineTo(x+12,y-14); ctx.lineTo(x+12,y+14); }
  else { ctx.moveTo(x+12,y); ctx.lineTo(x-12,y-14); ctx.lineTo(x-12,y+14); }
  ctx.closePath(); ctx.fill();
  ctx.font='bold 10px sans-serif'; ctx.fillStyle='#fff'; ctx.textAlign='center';
  ctx.fillText('MAT', x, y+30);
  ctx.restore();
}

function drawTrajectoryPreview(){
  if(gameState!=='charging') return;
  let x=char.x, y=char.y;
  let vx=vxOf(chargePower), vy=-vyMagOf(chargePower);
  ctx.save(); ctx.translate(-cameraX,0);
  ctx.setLineDash([7,7]);
  ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x,y);
  for(let i=0;i<90;i++){
    vy+=level.gravity; x+=vx; y+=vy;
    ctx.lineTo(x,y);
    if(y>level.groundY+80) break;
  }
  ctx.stroke(); ctx.setLineDash([]); ctx.restore();
}

// ---------------------------------------------------------------------
// ROTATION GAUGE
// ---------------------------------------------------------------------
function drawRotationGauge(){
  if(gameState!=='airborne') return;
  const cx=W/2, cy=140, r=26, tol=0.42;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r+10,0,Math.PI*2);
  ctx.fillStyle='rgba(10,12,20,0.6)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.12)'; ctx.lineWidth=1; ctx.stroke();

  ctx.strokeStyle='rgba(248,113,113,0.55)'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();

  ctx.strokeStyle='#34d399'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2-tol,-Math.PI/2+tol); ctx.stroke();

  const norm=((char.theta%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  const ang=-Math.PI/2+norm;
  const onTarget=Math.min(norm,Math.PI*2-norm)<tol;
  ctx.strokeStyle=onTarget?'#34d399':'#facc15'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(ang)*r*0.82, cy+Math.sin(ang)*r*0.82); ctx.stroke();
  ctx.fillStyle=onTarget?'#34d399':'#facc15';
  ctx.beginPath(); ctx.arc(cx,cy,3.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#e5e7eb'; ctx.fillRect(cx-1.5,cy-r-9,3,8);
  ctx.restore();
}

// ---------------------------------------------------------------------
// CHARACTER RENDER
// ---------------------------------------------------------------------
function drawCharacter(c, color){
  const p=worldPose(c);
  ctx.save(); ctx.translate(-cameraX,0);
  ctx.strokeStyle=color; ctx.lineWidth=8; ctx.lineCap='round';
  function line(a,b){ ctx.beginPath(); ctx.moveTo(p[a][0],p[a][1]); ctx.lineTo(p[b][0],p[b][1]); ctx.stroke(); }
  line('neck','hip');
  line('neck','shL'); line('shL','elL'); line('elL','haL');
  line('neck','shR'); line('shR','elR'); line('elR','haR');
  line('hip','kneeL'); line('kneeL','footL');
  line('hip','kneeR'); line('kneeR','footR');
  ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=3; line('neck','hip');
  ctx.fillStyle='#fcd34d';
  ctx.beginPath(); ctx.arc(p.head[0],p.head[1],16,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// ---------------------------------------------------------------------
// RENDER LOOP
// ---------------------------------------------------------------------
let lastT=performance.now();
function frame(now){
  const dt=Math.min((now-lastT)/16.6667,3);
  lastT=now;

  update(dt);

  ctx.clearRect(0,0,W,H);
  drawBackground();
  drawLandingMat();
  drawPedestal();
  drawOffscreenZoneArrow();
  drawTrajectoryPreview();

  if(gameState==='crashed' && ragdoll){
    drawRagdoll(ragdoll);
  } else {
    const color = (gameState==='success'||gameState==='level-complete') ? '#34d399' : '#facc15';
    drawCharacter(char,color);
  }

  drawParticles();
  drawRotationGauge();

  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------
resize();
requestAnimationFrame(frame);

})();
</script>
